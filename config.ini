# Project Configuration

[data]
sample_size = 1000
preprocessing_lowercase = true
preprocessing_remove_stopwords = false

[autocomplete]
# Trie parameters
max_predictions = 10
min_frequency = 1

# N-gram parameters
ngram_n = 3
ngram_top_k = 5

# Frequency-based parameters
similarity_threshold = 0.6

[autocorrect]
max_edit_distance = 2
context_window = 2
top_corrections = 5

[evaluation]
train_test_split = 0.8
random_seed = 42

[visualization]
figure_dpi = 300
figure_format = png
figure_size_width = 12
figure_size_height = 6

[paths]
data_dir = ./data
notebook_dir = ./notebooks
result_dir = ./results
src_dir = ./src
